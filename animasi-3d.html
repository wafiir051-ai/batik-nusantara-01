<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kain Batik 3D — Animasi Web</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F5EFE2; }
  #stage { position: fixed; inset: 0; }
  .overlay {
    position: fixed; z-index: 10; pointer-events: none; color: #2B2118;
    font-family: 'Alegreya Sans', sans-serif;
  }
  .overlay.top { top: 24px; left: 28px; }
  .overlay.top h1 { font-family: Marcellus, serif; font-size: 26px; font-weight: 400; margin: 0; }
  .overlay.top p { margin: 5px 0 0; font-size: 14px; color: #6B5B42; }
  .overlay a { pointer-events: auto; color: #44507E; font-weight: 700; text-decoration: none; }
  .overlay a:hover { color: #7A5427; }
  .overlay.bottom { bottom: 22px; left: 0; right: 0; text-align: center; font-size: 13px; color: #8A7657; letter-spacing: 0.12em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="overlay top">
  <h1>Kain Batik Berkibar</h1>
  <p>Animasi 3D — seret untuk memutar, gulir untuk zoom · <a href="Batik Nusantara.dc.html">&larr; kembali ke website</a></p>
</div>
<div class="overlay bottom" id="note">Motif Parang &amp; Kawung · representasi bergaya</div>
<script>
  if (new URLSearchParams(location.search).has('custom') && localStorage.getItem('batikCustomTexture')) {
    document.getElementById('note').textContent = 'Desain karyamu dari Studio Batik';
  }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── batik texture painted programmatically (geometric, stylized) ──
function batikTexture() {
  const w = 1024, h = 640, cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  g.fillStyle = '#EAD9B6'; g.fillRect(0, 0, w, h);
  // parang diagonal bands (left 2/3)
  g.save();
  g.beginPath(); g.rect(0, 0, w * 0.62, h); g.clip();
  g.strokeStyle = '#6B4A1F'; g.lineWidth = 14;
  for (let i = -h; i < w; i += 46) {
    g.beginPath(); g.moveTo(i, h); g.lineTo(i + h, 0); g.stroke();
  }
  g.strokeStyle = 'rgba(107,74,31,0.45)'; g.lineWidth = 5;
  for (let i = -h + 23; i < w; i += 46) {
    g.beginPath(); g.moveTo(i, h); g.lineTo(i + h, 0); g.stroke();
  }
  g.restore();
  // kawung four-circle clusters (right 1/3)
  g.save();
  g.beginPath(); g.rect(w * 0.62, 0, w * 0.38, h); g.clip();
  g.fillStyle = '#F1E6C8'; g.fillRect(w * 0.62, 0, w, h);
  const cell = 56;
  for (let x = w * 0.62 + cell / 2; x < w; x += cell) {
    for (let y = cell / 2; y < h; y += cell) {
      for (const [dx, dy] of [[-12, 0], [12, 0], [0, -12], [0, 12]]) {
        g.fillStyle = (dx === 0) ? '#44507E' : '#6B4A1F';
        g.beginPath(); g.ellipse(x + dx, y + dy, dx === 0 ? 7 : 11, dx === 0 ? 11 : 7, 0, 0, Math.PI * 2); g.fill();
      }
      g.fillStyle = '#7A5427';
      g.beginPath(); g.arc(x, y, 3, 0, Math.PI * 2); g.fill();
    }
  }
  g.restore();
  // seam + borders
  g.fillStyle = '#7A5427';
  g.fillRect(w * 0.62 - 5, 0, 10, h);
  g.fillRect(0, 0, w, 16); g.fillRect(0, h - 16, w, 16);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

const embed = new URLSearchParams(location.search).has('embed');
const custom = new URLSearchParams(location.search).has('custom');
if (embed) document.querySelectorAll('.overlay').forEach((o) => (o.style.display = 'none'));
function customTexture() {
  const data = localStorage.getItem('batikCustomTexture');
  if (!data) return null;
  const img = new Image();
  const tex = new THREE.Texture(img);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  img.onload = () => { tex.needsUpdate = true; };
  img.src = data;
  return tex;
}

const el = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
el.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#F5EFE2');
scene.fog = new THREE.Fog('#F5EFE2', 6, 14);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 0.6, 4.6);

scene.add(new THREE.HemisphereLight(0xfff6e6, 0xb0a184, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(3, 4, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe4f2, 0.5);
fill.position.set(-4, -1, -3);
scene.add(fill);

// ── waving cloth ──
const SEG_X = 140, SEG_Y = 90;
const geo = new THREE.PlaneGeometry(3.4, 2.1, SEG_X, SEG_Y);
const mat = new THREE.MeshStandardMaterial({
  map: (custom && customTexture()) || batikTexture(), side: THREE.DoubleSide, roughness: 0.9, metalness: 0
});
const cloth = new THREE.Mesh(geo, mat);
cloth.rotation.z = -0.06;
scene.add(cloth);

// soft "ground" tint so the cloth doesn't float in nothing
const discGeo = new THREE.CircleGeometry(2.2, 64);
const discMat = new THREE.MeshBasicMaterial({ color: 0xdccdaa, transparent: true, opacity: 0.5 });
const disc = new THREE.Mesh(discGeo, discMat);
disc.rotation.x = -Math.PI / 2;
disc.position.y = -1.55;
scene.add(disc);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enabled = !embed;
if (embed) camera.position.set(0, 0.35, 4.1);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.minDistance = 2.2;
controls.maxDistance = 9;

const pos = geo.attributes.position;
const base = pos.array.slice();
const clock = new THREE.Clock();

function wave(x, y, t) {
  return 0.11 * Math.sin(x * 1.8 + t * 1.1)
       + 0.06 * Math.sin(y * 2.6 + t * 1.5)
       + 0.03 * Math.sin((x + y) * 4.0 + t * 2.0);
}

function tick() {
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  for (let i = 0; i < pos.count; i++) {
    const x = base[i * 3], y = base[i * 3 + 1];
    // edges wave more than the center, like held cloth
    const hold = 0.35 + 0.65 * Math.abs(x) / 1.7;
    pos.array[i * 3 + 2] = wave(x, y, t) * hold;
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  cloth.rotation.y = Math.sin(t * 0.2) * 0.08;
  // soft shadow blob follows the cloth's sway
  disc.material.opacity = 0.45 + 0.08 * Math.sin(t * 1.1);
  controls.update();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
